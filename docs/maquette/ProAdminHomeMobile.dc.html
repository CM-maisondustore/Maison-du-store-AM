<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Espace Pro — accueil Admin (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="color-scheme: {{colorScheme}}; width: 100%; box-sizing: border-box; min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: {{pal.t353535}}; background: {{pal.sf4f4f1}}; display: flex; flex-direction: column">
<header style="position: sticky; top: 0; z-index: 4; background: {{pal.sffffff}}; border-bottom: 1px solid {{pal.be8e4db}}; padding: 10px 16px 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 500; color: {{pal.t1c1c1c}}">Bonjour Aïcha</h1><span style="font-size: 14px; color: {{pal.t6b665e}}">Lundi 26/10/2026, Admin-CM</span></span>
<button type="button" aria-label="Recherche globale" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: {{pal.sf4f4f1}}; color: {{pal.t1c1c1c}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-3.5-3.5"></path></svg></button>
</header>

<main id="contenu" style="flex: 1; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 20px">
<section aria-labelledby="q-t" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="q-t" style="margin: 0; font-size: 16px; font-weight: 600; color: {{pal.t1c1c1c}}">À traiter</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{queues}}" as="q" hint-placeholder-count="4">
<li style="display: flex"><a href="{{q.href}}" style="flex: 1; min-height: 104px; box-sizing: border-box; padding: 14px; background: {{pal.sffffff}}; border: 1px solid {{pal.be8e4db}}; border-radius: 12px; text-decoration: none; color: {{pal.t353535}}; display: flex; flex-direction: column; justify-content: space-between; gap: 6px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 500; line-height: 1; color: {{pal.t1c1c1c}}">{{q.n}}</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 600; color: {{pal.t1c1c1c}}">{{q.label}}</span><span style="{{q.subStyle}}">{{q.sub}}</span></span>
</a></li>
</sc-for>
</ul>
</section>

<section aria-labelledby="d-t" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 id="d-t" style="margin: 0; font-size: 16px; font-weight: 600; color: {{pal.t1c1c1c}}">Aujourd’hui sur le terrain</h2><a href="ProRdvMobile.dc.html" style="font-size: 14px; color: {{pal.t84642f}}">Planning</a></div>
<ol style="list-style: none; margin: 0; padding: 0; background: {{pal.sffffff}}; border: 1px solid {{pal.be8e4db}}; border-radius: 12px">
<sc-for list="{{today}}" as="e" hint-placeholder-count="3">
<li style="border-bottom: 1px solid {{pal.bf1eee8}}"><a href="ProPrestations.dc.html" style="display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; min-height: 64px; padding: 10px 14px; text-decoration: none; color: {{pal.t353535}}">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: {{pal.t1c1c1c}}">{{e.h}}</span>
<span style="min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; color: {{pal.t1c1c1c}}">{{e.client}}</span><span style="font-size: 13px; color: {{pal.t6b665e}}">{{e.meta}}</span></span>
<span style="{{e.badge}}"><span aria-hidden="true">{{e.glyph}}</span>{{e.st}}</span>
</a></li>
</sc-for>
</ol>
</section>

<section aria-labelledby="v-t" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 id="v-t" style="margin: 0; font-size: 16px; font-weight: 600; color: {{pal.t1c1c1c}}">Devis à valider</h2><a href="ProDevisListMobile.dc.html" style="font-size: 14px; color: {{pal.t84642f}}">Tous les devis</a></div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{devis}}" as="d" hint-placeholder-count="3">
<li><a href="ProDevisFiche.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: {{pal.sffffff}}; border: 1px solid {{pal.be8e4db}}; border-radius: 12px; text-decoration: none; color: {{pal.t353535}}">
<span style="display: flex; justify-content: space-between; gap: 10px"><span style="font-size: 15px; font-weight: 600; color: {{pal.t1c1c1c}}">{{d.client}}</span><span style="{{d.amountStyle}}">{{d.amount}}</span></span>
<span style="display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: {{pal.t6b665e}}"><span style="font-family: 'IBM Plex Mono', monospace">{{d.ref}}</span><span>{{d.when}}</span></span>
</a></li>
</sc-for>
</ul>
</section>
</main>

<div style="position: sticky; bottom: 0; z-index: 5"><dc-import name="ProTabbar" role="admin" active="home" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
