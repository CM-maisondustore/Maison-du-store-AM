<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Espace Pro — barre du haut</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="color-scheme: {{colorScheme}}; font-family: Inter, system-ui, sans-serif; color: {{pal.t353535}}; background: {{pal.sffffff}}; border-bottom: 1px solid {{pal.be8e4db}}; position: relative; z-index: 5">
<div style="height: 64px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 16px">
<sc-if value="{{tiny}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Recherche globale" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: {{pal.sf4f4f1}}; border: 0; border-radius: 6px; color: {{pal.t1c1c1c}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-3.5-3.5"></path></svg></button></sc-if>
<sc-if value="{{notTiny}}" hint-placeholder-val="{{ true }}">
<form role="search" style="flex: 1; max-width: 520px; position: relative; display: flex; align-items: center" onSubmit="{{noSubmit}}">
<label style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)" for="pro-search">Recherche globale</label>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{pal.t6b665e}}" stroke-width="1.6" aria-hidden="true" style="position: absolute; left: 12px"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-3.5-3.5"></path></svg>
<input id="pro-search" type="search" placeholder="{{searchPh}}" style="width: 100%; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 12px 0 40px; background: {{pal.sf4f4f1}}; border: 1px solid transparent; border-radius: 6px; font: inherit; font-size: 14px; color: {{pal.t1c1c1c}}">
</form>
</sc-if>
<div style="margin-left: auto; display: flex; align-items: center; gap: 12px">
<sc-if value="{{isAdmin}}" hint-placeholder-val="{{ true }}">
<div style="position: relative">
<button type="button" onClick="{{toggleNew}}" aria-expanded="{{newExpanded}}" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 12px; background: #c09f6a; border: 0; border-radius: 6px; color: #161616; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span style="{{labelStyle}}">Nouveau</span></button>
<sc-if value="{{newOpen}}" hint-placeholder-val="{{ false }}">
<div role="menu" style="position: absolute; right: 0; top: 46px; width: 220px; background: {{pal.sffffff}}; border: 1px solid {{pal.be8e4db}}; border-radius: 10px; box-shadow: 0 12px 28px -12px rgba(32,51,44,0.28); padding: 6px; display: flex; flex-direction: column">
<a role="menuitem" href="{{newDevisHref}}" style="padding: 10px 12px; border-radius: 6px; color: {{pal.t1c1c1c}}; text-decoration: none; font-size: 14px">Devis</a>
<a role="menuitem" href="ProPrestations.dc.html" style="padding: 10px 12px; border-radius: 6px; color: {{pal.t1c1c1c}}; text-decoration: none; font-size: 14px">Prestation</a>
<a role="menuitem" href="ProClients.dc.html" style="padding: 10px 12px; border-radius: 6px; color: {{pal.t1c1c1c}}; text-decoration: none; font-size: 14px">Contact</a>
<a role="menuitem" href="ProMessagerie.dc.html" style="padding: 10px 12px; border-radius: 6px; color: {{pal.t1c1c1c}}; text-decoration: none; font-size: 14px">Message</a>
</div>
</sc-if>
</div>
</sc-if>
<div style="position: relative">
<button type="button" onClick="{{toggleUser}}" aria-expanded="{{userExpanded}}" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 4px; background: transparent; border: 0; border-radius: 6px; font: inherit; color: {{pal.t1c1c1c}}; cursor: pointer">
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: {{pal.s20332c}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">{{initials}}</span>
<span style="{{nameBox}}">
<span style="font-size: 14px; font-weight: 600">{{name}}</span>
<span style="font-size: 12px; color: {{pal.t6b665e}}">{{roleLabel}}</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{pal.t6b665e}}" stroke-width="1.8" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{userOpen}}" hint-placeholder-val="{{ false }}">
<div role="menu" style="position: absolute; right: 0; top: 50px; width: 220px; background: {{pal.sffffff}}; border: 1px solid {{pal.be8e4db}}; border-radius: 10px; box-shadow: 0 12px 28px -12px rgba(32,51,44,0.28); padding: 6px; display: flex; flex-direction: column">
<a role="menuitem" href="{{profHref}}" style="padding: 10px 12px; border-radius: 6px; color: {{pal.t1c1c1c}}; text-decoration: none; font-size: 14px">Mon profil</a>
<a role="menuitem" href="{{setHref}}" style="padding: 10px 12px; border-radius: 6px; color: {{pal.t1c1c1c}}; text-decoration: none; font-size: 14px">Paramètres</a>
<a role="menuitem" href="ProPassword.dc.html" style="padding: 10px 12px; border-radius: 6px; color: {{pal.t1c1c1c}}; text-decoration: none; font-size: 14px">Changer le mot de passe</a>
<a role="menuitem" href="index.html" style="padding: 10px 12px; border-radius: 6px; color: {{pal.t1c1c1c}}; text-decoration: none; font-size: 14px">Voir le site</a>
<a role="menuitem" href="ProLogin.dc.html" style="padding: 10px 12px; border-radius: 6px; color: {{pal.tb3392f}}; text-decoration: none; font-size: 14px; border-top: 1px solid {{pal.be8e4db}}">Se déconnecter</a>
</div>
</sc-if>
</div>
</div>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["admin","agent"],"default":"admin"},"user":{"editor":"text","default":"Aïcha Diabaté"},"$preview":{"width":1200,"height":64}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { newOpen: false, userOpen: false, vw: typeof window !== 'undefined' ? window.innerWidth : 1440 };
}
componentDidMount() {
this.onR = () => { const w = document.documentElement.clientWidth || window.innerWidth; if (w && w !== this.state.vw) this.setState({ vw: w }); };
window.addEventListener('resize', this.onR);
if (typeof ResizeObserver !== 'undefined') { this.ro = new ResizeObserver(this.onR); this.ro.observe(document.documentElement); }
this.t1 = setTimeout(this.onR, 300);
this.t2 = setTimeout(this.onR, 1200);
this.onR();
}
componentWillUnmount() { window.removeEventListener('resize', this.onR); if (this.ro) this.ro.disconnect(); clearTimeout(this.t1); clearTimeout(this.t2); }

isDark() {
const t = this.props.theme;
if (t === 'dark') return true;
if (t === 'light') return false;
let v = 'light';
try { v = window.localStorage.getItem('mds-pro-theme') || 'light'; } catch (e) {}
if (v === 'dark') return true;
if (v === 'auto') { try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {} }
return false;
}
themeMaps() { return { s: {"#ffffff": "#1b2220", "#f4f4f1": "#121816", "#f9f8f4": "#202825", "#fbfaf7": "#1e2623", "#fdfbf6": "#222a27", "#fcfbf8": "#1e2623", "#faf9f7": "#1e2623", "#fffcf5": "#2b2618", "#f1f0ec": "#262e2b", "#ece9e2": "#2a322f", "#e9e8e2": "#2a302d", "#e9e6df": "#0f1412", "#eef0ec": "#232b28", "#eef1ef": "#202826", "#edf1f4": "#1d2530", "#e8e4db": "#313a36", "#dcd6cb": "#3b4540", "#f1eee8": "#29312e", "#efece5": "#29312e", "#cfc9bd": "#4c5751", "#cfc8bb": "#4c5751", "#e1ddd3": "#3b4540", "#b9b4aa": "#5a645e", "#20332c": "#2b4a3e", "#2b4239": "#34574a", "#e5f1ea": "#1d3a2b", "#b7d6c3": "#2f5a43", "#fdf8ec": "#2d2717", "#ecd7a8": "#5b4a25", "#fbf1dc": "#382d15", "#e3c2bd": "#5e302b", "#e3c3bf": "#5e302b", "#fbeceb": "#3a1f1c", "#e8eef5": "#1d2a38", "#eeede8": "#2a302d", "#f6f0e4": "#2f2a1f", "#f3f3f3": "#262e2b", "#cccccc": "#46504b", "#fdf6f5": "#33201e", "#f8e6e4": "#3a2220", "#fbf6ea": "#2d2717", "#ecdcb9": "#5b4a25", "#f6ece5": "#33241d", "#efe9dd": "#2a2620", "#d9b26a": "#8a6a2c", "#b98a2e": "#8a6a2c"}, b: {"#ffffff": "#1b2220", "#f4f4f1": "#121816", "#f9f8f4": "#202825", "#fbfaf7": "#1e2623", "#fdfbf6": "#222a27", "#fcfbf8": "#1e2623", "#faf9f7": "#1e2623", "#fffcf5": "#2b2618", "#f1f0ec": "#262e2b", "#ece9e2": "#2a322f", "#e9e8e2": "#2a302d", "#e9e6df": "#0f1412", "#eef0ec": "#232b28", "#eef1ef": "#202826", "#edf1f4": "#1d2530", "#e8e4db": "#313a36", "#dcd6cb": "#3b4540", "#f1eee8": "#29312e", "#efece5": "#29312e", "#cfc9bd": "#4c5751", "#cfc8bb": "#4c5751", "#e1ddd3": "#3b4540", "#b9b4aa": "#5a645e", "#20332c": "#5d8a76", "#2b4239": "#34574a", "#e5f1ea": "#1d3a2b", "#b7d6c3": "#2f5a43", "#fdf8ec": "#2d2717", "#ecd7a8": "#5b4a25", "#fbf1dc": "#382d15", "#e3c2bd": "#5e302b", "#e3c3bf": "#5e302b", "#fbeceb": "#3a1f1c", "#e8eef5": "#1d2a38", "#eeede8": "#2a302d", "#f6f0e4": "#2f2a1f", "#f3f3f3": "#262e2b", "#cccccc": "#46504b", "#fdf6f5": "#33201e", "#f8e6e4": "#3a2220", "#fbf6ea": "#2d2717", "#ecdcb9": "#5b4a25", "#f6ece5": "#33241d", "#efe9dd": "#2a2620", "#d9b26a": "#8a6a2c", "#b98a2e": "#8a6a2c", "#1c1c1c": "#d6d2c9", "#b3392f": "#f28b80"}, t: {"#1c1c1c": "#f1eee8", "#353535": "#d6d2c9", "#6b665e": "#a8a296", "#20332c": "#bfd8cb", "#84642f": "#d8b47a", "#2f7350": "#86cfa3", "#8c5f0e": "#e6b862", "#5e4108": "#f0d39a", "#b3392f": "#f28b80", "#7c241c": "#f5b0a8", "#3f6285": "#9ec0e3", "#2c4866": "#bcd3ea", "#5c5852": "#c9c4ba", "#b0aaa0": "#6c736e", "#3d2b06": "#f0dcb3", "#1f4d35": "#bfe3cc", "#8f2c24": "#f5b0a8", "#6e4a0b": "#e6c27a", "#3f5a72": "#a9c3dc", "#3f5a73": "#a9c3dc", "#8e4529": "#e0a084", "#5a5248": "#cfc8bb", "#b98a2e": "#d9ac57", "#2c4660": "#a9c3dc"} }; }
themeWatch() {
if (this.__thw || typeof window === 'undefined') return;
this.__thw = true;
const bump = () => this.setState({ __th: Date.now() });
try { window.addEventListener('storage', (e) => { if (e.key === 'mds-pro-theme') bump(); }); } catch (e) {}
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', bump); } catch (e) {}
}
dmap(v) {
const T = this.themeMaps();
const cv = (str) => str.split(';').map((seg) => {
const i = seg.indexOf(':');
let M = T.s;
if (i > -1) { const p = seg.slice(0, i).trim().toLowerCase(); M = /^(color|stroke|fill|caret-color|accent-color|text-decoration-color)$/.test(p) ? T.t : /^(border|outline|box-shadow)/.test(p) ? T.b : T.s; }
return seg.replace(/#[0-9a-fA-F]{6}/g, (h) => M[h.toLowerCase()] || h);
}).join(';');
const go = (x) => (typeof x === 'string' ? cv(x) : Array.isArray(x) ? x.map(go) : x && typeof x === 'object' && Object.prototype.toString.call(x) === '[object Object]' ? Object.keys(x).reduce((o, k) => { o[k] = go(x[k]); return o; }, {}) : x);
return go(v);
}
renderVals() {
this.themeWatch();
const dark = this.isDark();
let v = this.renderValsLight();
if (dark) v = this.dmap(v);
const T = this.themeMaps();
const pal = {};
['s', 'b', 't'].forEach((k) => { Object.keys(T[k]).forEach((h) => { pal[k + h.slice(1)] = dark ? T[k][h] : h; }); });
v.pal = pal;
v.themeDark = dark;
v.colorScheme = dark ? 'dark' : 'light';
return v;
}
renderValsLight() {
const p = this.props;
const s = this.state;
const vw = s.vw || 1440;
const compact = vw < 1024;
const tiny = vw < 768;
const admin = (p.role ?? 'admin') !== 'agent';
const name = p.user || (admin ? 'Aïcha Diabaté' : 'Koffi Brou');
return {
tiny, notTiny: !tiny,
searchPh: compact ? 'Rechercher' : 'Client, téléphone, n° de devis ou de facture',
labelStyle: compact ? 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)' : '',
nameBox: compact ? 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)' : 'display:flex;flex-direction:column;align-items:flex-start;line-height:1.2',
isAdmin: admin,
profHref: admin ? (tiny ? 'ProProfilEditMobileAdmin.dc.html' : 'ProProfilEdit.dc.html') : (tiny ? 'ProProfilEditMobile.dc.html' : 'ProProfilEditAgent.dc.html'),
setHref: admin ? (tiny ? 'ProParametresMobileAdmin.dc.html' : 'ProParametres.dc.html') : (tiny ? 'ProParametresMobile.dc.html' : 'ProParametresAgent.dc.html'),
newDevisHref: tiny ? 'ProDevisNewMobileAdmin.dc.html' : 'ProDevisNew.dc.html',
name,
initials: name.split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase(),
roleLabel: admin ? 'Admin-CM' : 'Agent',
newOpen: s.newOpen,
userOpen: s.userOpen,
newExpanded: s.newOpen ? 'true' : 'false',
userExpanded: s.userOpen ? 'true' : 'false',
toggleNew: () => this.setState({ newOpen: !s.newOpen, userOpen: false }),
toggleUser: () => this.setState({ userOpen: !s.userOpen, newOpen: false }),
noSubmit: (e) => e.preventDefault()
};
}
}
</script>
</body>
</html>
