<!doctype html>

<body>
<x-dc>
<helmet>

<style>body{margin:0}</style>
</helmet>
<div style="color-scheme: {{colorScheme}}; width: 100%; box-sizing: border-box; min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: {{pal.t353535}}; background: {{pal.sf4f4f1}}; display: flex; flex-direction: column">
<header style="position: sticky; top: 0; z-index: 4; background: {{pal.sffffff}}; border-bottom: 1px solid {{pal.be8e4db}}; padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 500; color: {{pal.t1c1c1c}}">Clients</h1><span style="font-size: 13px; color: {{pal.t6b665e}}">318 au total</span></div>
<label style="position: relative; display: flex; align-items: center"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher un client</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{pal.t6b665e}}" stroke-width="1.6" aria-hidden="true" style="position: absolute; left: 12px"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-3.5-3.5"></path></svg><input type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Nom, téléphone ou commune" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 12px 0 40px; border: 1px solid {{pal.bdcd6cb}}; border-radius: 10px; background: {{pal.sf9f8f4}}; font: inherit; font-size: 16px"></label>
</header>

<main id="contenu" style="flex: 1; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px">
<a href="ProClients.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 12px; background: {{pal.sfbf1dc}}; border: 1px solid {{pal.becd7a8}}; color: {{pal.t5e4108}}; text-decoration: none; font-size: 14px"><span><strong style="font-weight: 600">! 4 contacts à qualifier</strong><br><span style="font-size: 13px">Demandes du site et messages non rattachés</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<li style="background: {{pal.sffffff}}; border: 1px solid {{pal.be8e4db}}; border-radius: 12px; overflow: hidden">
<a href="ProClient.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: {{pal.t353535}}">
<span aria-hidden="true" style="{{r.avatar}}">{{r.ini}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; color: {{pal.t1c1c1c}}">{{r.name}}</span><span style="font-size: 13px; color: {{pal.t6b665e}}">{{r.meta}}</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{pal.t6b665e}}" stroke-width="1.8" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<span style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid {{pal.bf1eee8}}">
<a href="{{r.tel}}" aria-label="{{r.callLabel}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 46px; color: {{pal.t20332c}}; text-decoration: none; font-size: 14px; font-weight: 600; border-right: 1px solid {{pal.bf1eee8}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>Appeler</a>
<a href="{{r.wa}}" aria-label="{{r.waLabel}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 46px; color: {{pal.t20332c}}; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 20l1.5-4A8 8 0 1 1 8 19z"></path></svg>WhatsApp</a>
</span>
</li>
</sc-for>
</ul>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 24px 8px; text-align: center; font-size: 15px; color: {{pal.t6b665e}}">Aucun client ne correspond.</p></sc-if>
</main>

<a href="ProClients.dc.html" style="position: sticky; bottom: 96px; z-index: 6; align-self: flex-end; margin: -72px 16px 16px 0; display: inline-flex; align-items: center; gap: 8px; height: 56px; padding: 0 20px 0 16px; border-radius: 999px; background: #c09f6a; color: #161616; text-decoration: none; font-size: 15px; font-weight: 600; box-shadow: 0 10px 24px -10px rgba(32,51,44,0.5)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nouveau contact</a>
<div style="position: sticky; bottom: 0; z-index: 5"><dc-import name="ProTabbar" role="admin" active="clients" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { q: '' };
}
isDark() {
const t = this.props.theme;
if (t === 'dark') return true;
if (t === 'light') return false;
let v = 'light';
try { v = window.localStorage.getItem('mds-pro-theme') || 'light'; } catch (e) {}
if (v === 'dark') return true;
if (v === 'auto') { try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {} }
return false;
}
themeMaps() { return { s: {"#ffffff": "#1b2220", "#f4f4f1": "#121816", "#f9f8f4": "#202825", "#fbfaf7": "#1e2623", "#fdfbf6": "#222a27", "#fcfbf8": "#1e2623", "#faf9f7": "#1e2623", "#fffcf5": "#2b2618", "#f1f0ec": "#262e2b", "#ece9e2": "#2a322f", "#e9e8e2": "#2a302d", "#e9e6df": "#0f1412", "#eef0ec": "#232b28", "#eef1ef": "#202826", "#edf1f4": "#1d2530", "#e8e4db": "#313a36", "#dcd6cb": "#3b4540", "#f1eee8": "#29312e", "#efece5": "#29312e", "#cfc9bd": "#4c5751", "#cfc8bb": "#4c5751", "#e1ddd3": "#3b4540", "#b9b4aa": "#5a645e", "#20332c": "#2b4a3e", "#2b4239": "#34574a", "#e5f1ea": "#1d3a2b", "#b7d6c3": "#2f5a43", "#fdf8ec": "#2d2717", "#ecd7a8": "#5b4a25", "#fbf1dc": "#382d15", "#e3c2bd": "#5e302b", "#e3c3bf": "#5e302b", "#fbeceb": "#3a1f1c", "#e8eef5": "#1d2a38", "#eeede8": "#2a302d", "#f6f0e4": "#2f2a1f", "#f3f3f3": "#262e2b", "#cccccc": "#46504b", "#fdf6f5": "#33201e", "#f8e6e4": "#3a2220", "#fbf6ea": "#2d2717", "#ecdcb9": "#5b4a25", "#f6ece5": "#33241d", "#efe9dd": "#2a2620", "#d9b26a": "#8a6a2c", "#b98a2e": "#8a6a2c"}, b: {"#ffffff": "#1b2220", "#f4f4f1": "#121816", "#f9f8f4": "#202825", "#fbfaf7": "#1e2623", "#fdfbf6": "#222a27", "#fcfbf8": "#1e2623", "#faf9f7": "#1e2623", "#fffcf5": "#2b2618", "#f1f0ec": "#262e2b", "#ece9e2": "#2a322f", "#e9e8e2": "#2a302d", "#e9e6df": "#0f1412", "#eef0ec": "#232b28", "#eef1ef": "#202826", "#edf1f4": "#1d2530", "#e8e4db": "#313a36", "#dcd6cb": "#3b4540", "#f1eee8": "#29312e", "#efece5": "#29312e", "#cfc9bd": "#4c5751", "#cfc8bb": "#4c5751", "#e1ddd3": "#3b4540", "#b9b4aa": "#5a645e", "#20332c": "#5d8a76", "#2b4239": "#34574a", "#e5f1ea": "#1d3a2b", "#b7d6c3": "#2f5a43", "#fdf8ec": "#2d2717", "#ecd7a8": "#5b4a25", "#fbf1dc": "#382d15", "#e3c2bd": "#5e302b", "#e3c3bf": "#5e302b", "#fbeceb": "#3a1f1c", "#e8eef5": "#1d2a38", "#eeede8": "#2a302d", "#f6f0e4": "#2f2a1f", "#f3f3f3": "#262e2b", "#cccccc": "#46504b", "#fdf6f5": "#33201e", "#f8e6e4": "#3a2220", "#fbf6ea": "#2d2717", "#ecdcb9": "#5b4a25", "#f6ece5": "#33241d", "#efe9dd": "#2a2620", "#d9b26a": "#8a6a2c", "#b98a2e": "#8a6a2c", "#1c1c1c": "#d6d2c9", "#b3392f": "#f28b80"}, t: {"#1c1c1c": "#f1eee8", "#353535": "#d6d2c9", "#6b665e": "#a8a296", "#20332c": "#bfd8cb", "#84642f": "#d8b47a", "#2f7350": "#86cfa3", "#8c5f0e": "#e6b862", "#5e4108": "#f0d39a", "#b3392f": "#f28b80", "#7c241c": "#f5b0a8", "#3f6285": "#9ec0e3", "#2c4866": "#bcd3ea", "#5c5852": "#c9c4ba", "#b0aaa0": "#6c736e", "#3d2b06": "#f0dcb3", "#1f4d35": "#bfe3cc", "#8f2c24": "#f5b0a8", "#6e4a0b": "#e6c27a", "#3f5a72": "#a9c3dc", "#3f5a73": "#a9c3dc", "#8e4529": "#e0a084", "#5a5248": "#cfc8bb", "#b98a2e": "#d9ac57", "#2c4660": "#a9c3dc"} }; }
themeWatch() {
if (this.__thw || typeof window === 'undefined') return;
this.__thw = true;
const bump = () => this.setState({ __th: Date.now() });
try { window.addEventListener('storage', (e) => { if (e.key === 'mds-pro-theme') bump(); }); } catch (e) {}
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', bump); } catch (e) {}
}
dmap(v) {
const T = this.themeMaps();
const cv = (str) => str.split(';').map((seg) => {
const i = seg.indexOf(':');
let M = T.s;
if (i > -1) { const p = seg.slice(0, i).trim().toLowerCase(); M = /^(color|stroke|fill|caret-color|accent-color|text-decoration-color)$/.test(p) ? T.t : /^(border|outline|box-shadow)/.test(p) ? T.b : T.s; }
return seg.replace(/#[0-9a-fA-F]{6}/g, (h) => M[h.toLowerCase()] || h);
}).join(';');
const go = (x) => (typeof x === 'string' ? cv(x) : Array.isArray(x) ? x.map(go) : x && typeof x === 'object' && Object.prototype.toString.call(x) === '[object Object]' ? Object.keys(x).reduce((o, k) => { o[k] = go(x[k]); return o; }, {}) : x);
return go(v);
}
renderVals() {
this.themeWatch();
const dark = this.isDark();
let v = this.renderValsLight();
if (dark) v = this.dmap(v);
const T = this.themeMaps();
const pal = {};
['s', 'b', 't'].forEach((k) => { Object.keys(T[k]).forEach((h) => { pal[k + h.slice(1)] = dark ? T[k][h] : h; }); });
v.pal = pal;
v.themeDark = dark;
v.colorScheme = dark ? 'dark' : 'light';
return v;
}
renderValsLight() {
const s = this.state;
const C = [
['Mme Ouattara Fatou', 'part', 'Cocody Angré', '0708123456', '3 devis'],
['Cabinet Traoré & Associés', 'pro', 'Plateau', '2720219874', '4 devis'],
['M. Kacou Hervé', 'part', 'II Plateaux Vallons', '0544187203', '1 devis'],
['Mme Kouassi Aya', 'part', 'Cité Riviera 3', '0742186605', '2 devis'],
['Clinique des Lagunes', 'pro', 'Cocody', '2722441020', '2 devis'],
['M. Bamba Ibrahim', 'part', 'Marcory Zone 4', '0102334567', '2 devis']
];
const q = s.q.trim().toLowerCase().replace(/ /g, '');
const rows = C.filter((c) => !q || (c[0] + c[2] + c[3]).toLowerCase().replace(/ /g, '').includes(q)).map((c) => ({
name: c[0], meta: c[2] + ', ' + c[4],
ini: c[0].replace(/^(M\.|Mme)\s/, '').split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase(),
avatar: 'flex:none;width:40px;height:40px;border-radius:' + (c[1] === 'pro' ? '10px' : '50%') + ';display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;' + (c[1] === 'pro' ? 'background:#f6f0e4;color:#84642f' : 'background:#20332c;color:#ffffff'),
tel: 'tel:+225' + c[3], wa: 'https://wa.me/225' + c[3],
callLabel: 'Appeler ' + c[0], waLabel: 'Écrire sur WhatsApp à ' + c[0]
}));
return { q: s.q, setQ: (e) => this.setState({ q: e.target.value }), rows, empty: rows.length === 0 };
}
}
</script>
</body>
</html>
