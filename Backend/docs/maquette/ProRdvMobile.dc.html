<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Espace Pro — mes rendez-vous (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="color-scheme: {{colorScheme}}; width: 100%; box-sizing: border-box; min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: {{pal.t353535}}; background: {{pal.sf4f4f1}}; display: flex; flex-direction: column">
<header style="position: sticky; top: 0; z-index: 4; background: {{pal.sffffff}}; border-bottom: 1px solid {{pal.be8e4db}}; padding: 10px 0 10px; display: flex; flex-direction: column; gap: 10px">
<div style="padding: 0 16px; display: flex; justify-content: space-between; align-items: baseline"><h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 500; color: {{pal.t1c1c1c}}">Mes rendez-vous</h1><span style="font-size: 13px; color: {{pal.t6b665e}}">Octobre 2026</span></div>
<div role="tablist" aria-label="Jour" style="display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 2px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button type="button" role="tab" aria-selected="{{d.sel}}" aria-label="{{d.aria}}" onClick="{{d.pick}}" style="{{d.style}}"><span style="font-size: 12px">{{d.dow}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 500">{{d.n}}</span><span aria-hidden="true" style="{{d.dot}}"></span></button>
</sc-for>
</div>
</header>

<main id="contenu" role="tabpanel" style="flex: 1; padding: 18px 16px 120px; display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 600; color: {{pal.t1c1c1c}}">{{dayTitle}}</h2>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 28px 16px; text-align: center; background: {{pal.sffffff}}; border: 1px dashed {{pal.bdcd6cb}}; border-radius: 12px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 600; color: {{pal.t1c1c1c}}">Aucun rendez-vous ce jour-là.</span><span style="font-size: 14px; color: {{pal.t6b665e}}">Le bureau vous préviendra si un créneau vous est affecté.</span></div>
</sc-if>
<ol style="list-style: none; margin: 0; padding: 0; position: relative">
<sc-for list="{{items}}" as="e" hint-placeholder-count="3">
<li style="display: grid; grid-template-columns: 54px 22px 1fr; gap: 0 8px; align-items: stretch">
<span style="padding-top: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: {{pal.t1c1c1c}}; text-align: right">{{e.h}}</span>
<span aria-hidden="true" style="position: relative; display: flex; justify-content: center"><span style="position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: {{e.rail}}"></span><span style="{{e.ring}}"></span></span>
<a href="ProPrestation.dc.html" style="margin: 6px 0 10px; padding: 12px 14px; background: {{pal.sffffff}}; border: 1px solid {{pal.be8e4db}}; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: {{pal.t353535}}">
<span style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px"><span style="font-size: 16px; font-weight: 600; color: {{pal.t1c1c1c}}">{{e.client}}</span><span style="{{e.badge}}"><span aria-hidden="true">{{e.glyph}}</span>{{e.st}}</span></span>
<span style="font-size: 14px; color: {{pal.t6b665e}}">{{e.kind}}, jusqu’à <span style="font-family: 'IBM Plex Mono', monospace">{{e.end}}</span></span>
<span style="display: flex; gap: 8px; padding-top: 4px">
<span style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border: 1px solid {{pal.bdcd6cb}}; border-radius: 8px; font-size: 14px; font-weight: 600; color: {{pal.t20332c}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>Appeler</span>
<span style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border: 1px solid {{pal.bdcd6cb}}; border-radius: 8px; font-size: 14px; font-weight: 600; color: {{pal.t20332c}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"></path></svg>Itinéraire</span>
</span>
</a>
</li>
</sc-for>
</ol>
</main>
<div style="position: sticky; bottom: 0; z-index: 5"><dc-import name="ProTabbar" role="agent" active="rdv" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>

themeWatch() {
if (this.__thw || typeof window === 'undefined') return;
this.__thw = true;
const bump = () => this.setState({ __th: Date.now() });
try { window.addEventListener('storage', (e) => { if (e.key === 'mds-pro-theme') bump(); }); } catch (e) {}

dmap(v) {

const cv = (str) => str.split(';').map((seg) => {
const i = seg.indexOf(':');
let M = T.s;
if (i > -1) { const p = seg.slice(0, i).trim().toLowerCase(); M = /^(color|stroke|fill|caret-color|accent-color|text-decoration-color)$/.test(p) ? T.t : /^(border|outline|box-shadow)/.test(p) ? T.b : T.s; }
